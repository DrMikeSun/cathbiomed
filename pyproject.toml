[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cathbiomed"
version = "1.5"
description = "医学与生命科学领域的文献采集、筛选、归档与知识图谱构建管线"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pyarrow>=14.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "PySide6>=6.5",
]

[project.scripts]
cathbiomed = "medlitflow.cli:main"
cathbiomed-ui = "ui.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["medlitflow*", "ui*"]
